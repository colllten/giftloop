# CI: validates the database and web app on every PR and push to main.
# Pushes to main also publish the JVM image to GHCR (no deploy yet).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.106.0
  # Services the web tests don't need; skipping them speeds up `supabase start`.
  SUPABASE_EXCLUDE: studio,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,imgproxy

jobs:
  database:
    name: Database (lint + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start Postgres (applies migrations + seed)
        run: supabase db start
      - name: Lint schemas
        run: supabase db lint --level warning --fail-on warning
      - name: pgTAP tests
        run: supabase test db

  web:
    name: Web (tests + package)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start Supabase (applies migrations + seed)
        working-directory: database
        run: supabase start -x "$SUPABASE_EXCLUDE"
      - name: Test and package
        working-directory: web
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: web/target/surefire-reports/
          retention-days: 7
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: web/target/quarkus-app/
          retention-days: 1

  image:
    name: Container image
    needs: [database, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: quarkus-app
          path: web/target/quarkus-app/
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (push on main)
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
