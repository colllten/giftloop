# Applies new Supabase migrations to the hosted production project.
# Runs when migrations land on main (already validated by CI on the PR), and
# waits for approval on the `production` environment. Seed data is never pushed.
name: Deploy database

on:
  push:
    branches: [main]
    paths: ['database/supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: deploy-db-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.106.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations
        run: supabase db push --dry-run
      - name: Push migrations
        run: supabase db push
