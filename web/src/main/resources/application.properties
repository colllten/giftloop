# GiftLoop web. Defaults target the local Supabase stack (`supabase start` in database/).
supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
# Publishable (client-side) key. Local default is Supabase's shared dev key.
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
quarkus.rest-client.supabase.url=${supabase.url}

# --- Datasource -------------------------------------------------------------
# Supabase CLI owns the schema (migrations), so no Dev Services / Flyway.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SUPABASE_DB_JDBC_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
quarkus.datasource.username=${SUPABASE_DB_USER:postgres}
quarkus.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
quarkus.datasource.devservices.enabled=false

# --- Auth: verify Supabase-issued JWTs (ES256 via JWKS) ----------------------
mp.jwt.verify.publickey.location=${supabase.url}/auth/v1/.well-known/jwks.json
mp.jwt.verify.publickey.algorithm=ES256
mp.jwt.verify.issuer=${supabase.url}/auth/v1
mp.jwt.verify.audiences=authenticated
# Browser sessions use the gl_at cookie; API clients may send Authorization: Bearer.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=gl_at
smallrye.jwt.always-check-authorization=true
# Authenticate lazily so public pages ignore stale cookies (see ADR 003).
quarkus.http.auth.proactive=false

# --- Session cookies (ADR 003) -----------------------------------------------
giftloop.session.secure-cookies=true
%dev.giftloop.session.secure-cookies=false
%test.giftloop.session.secure-cookies=false
giftloop.session.refresh-max-age=P30D

# --- CSRF (form posts, incl. HTMX) -------------------------------------------
quarkus.rest-csrf.cookie-name=gl_csrf
quarkus.rest-csrf.form-field-name=csrf_token
quarkus.rest-csrf.cookie-force-secure=true
%dev.quarkus.rest-csrf.cookie-force-secure=false
%test.quarkus.rest-csrf.cookie-force-secure=false

# --- OpenAPI -----------------------------------------------------------------
quarkus.smallrye-openapi.info-title=GiftLoop API
quarkus.swagger-ui.always-include=false

# --- Logging -----------------------------------------------------------------
quarkus.log.category."com.giftloop".level=INFO
%dev.quarkus.log.category."com.giftloop".level=DEBUG
