<form hx-post="/groups" hx-target="this" hx-swap="outerHTML">
  {#csrf /}
  <div class="field">
    <label for="name">Group name <span class="hint">For example, “Glover Family” or “Book Club”.</span></label>
    <input id="name" name="name" type="text" maxlength="100" required autofocus value="{name ?: ''}"
           {#if error}aria-invalid="true" aria-describedby="name-error"{/if}>
    {#if error}<p id="name-error" class="error" role="alert">{error}</p>{/if}
  </div>
  <button class="primary" type="submit">Create group</button>
</form>
