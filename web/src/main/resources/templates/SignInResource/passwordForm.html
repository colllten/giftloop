<form hx-post="/signin/password" hx-target="#auth-step">
  {#csrf /}
  <input type="hidden" name="next" value="{next}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus
           value="{email ?: ''}" {#if emailError}aria-invalid="true" aria-describedby="email-error"{/if}>
    {#if emailError}<p id="email-error" class="error" role="alert">{emailError}</p>{/if}
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required
           {#if passwordError}aria-invalid="true" aria-describedby="password-error"{/if}>
    {#if passwordError}<p id="password-error" class="error" role="alert">{passwordError}</p>{/if}
    <a class="hint" href="/signin/reset{#if next != '/'}?next={next.urlEncode}{/if}">Forgot password?</a>
  </div>
  <button class="primary" type="submit">Sign in</button>
</form>
<p><a href="/signin/code{#if next != '/'}?next={next.urlEncode}{/if}">Email me a sign-in code instead</a></p>
