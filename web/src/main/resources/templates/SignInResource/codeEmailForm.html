<form hx-post="/signin/code" hx-target="#auth-step">
  {#csrf /}
  <input type="hidden" name="next" value="{next}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus
           value="{email ?: ''}" {#if error}aria-invalid="true" aria-describedby="email-error"{/if}>
    {#if error}<p id="email-error" class="error" role="alert">{error}</p>{/if}
  </div>
  <button class="primary" type="submit">Email me a code</button>
</form>
