<form hx-post="/signin/reset/password" hx-target="#auth-step">
  {#csrf /}
  <input type="hidden" name="next" value="{next}">
  <div class="field">
    <label for="password">New password <span class="hint">At least 8 characters.</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus
           {#if error}aria-invalid="true" aria-describedby="password-error"{/if}>
    {#if error}<p id="password-error" class="error" role="alert">{error}</p>{/if}
  </div>
  <button class="primary" type="submit">Save password</button>
</form>
