<p class="notice">If <strong>{email}</strong> has a GiftLoop account, we sent it a 6-digit code. It may take a minute to arrive.</p>
<form hx-post="/signin/reset/verify" hx-target="#auth-step">
  {#csrf /}
  <input type="hidden" name="email" value="{email}">
  <input type="hidden" name="next" value="{next}">
  <div class="field">
    <label for="code">Code from the email</label>
    <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*"
           maxlength="7" required autofocus {#if error}aria-invalid="true" aria-describedby="code-error"{/if}>
    {#if error}<p id="code-error" class="error" role="alert">{error}</p>{/if}
  </div>
  <button class="primary" type="submit">Continue</button>
</form>
<form hx-post="/signin/reset" hx-target="#auth-step" style="margin-top:1rem">
  {#csrf /}
  <input type="hidden" name="email" value="{email}">
  <input type="hidden" name="next" value="{next}">
  <button class="link-button" type="submit">Send a new code</button>
  · <a href="/signin/reset{#if next != '/'}?next={next.urlEncode}{/if}">Use a different email</a>
</form>
