<form hx-post="/signup" hx-target="#auth-step">
  {#csrf /}
  <input type="hidden" name="next" value="{next}">
  <div class="field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus
           value="{email ?: ''}" {#if emailError}aria-invalid="true" aria-describedby="email-error"{/if}>
    {#if emailError}<p id="email-error" class="error" role="alert">{emailError}</p>{/if}
  </div>
  <div class="field">
    <label for="password">Password <span class="hint">At least 8 characters.</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required
           {#if passwordError}aria-invalid="true" aria-describedby="password-error"{/if}>
    {#if passwordError}<p id="password-error" class="error" role="alert">{passwordError}</p>{/if}
  </div>
  <button class="primary" type="submit">Create account</button>
</form>
